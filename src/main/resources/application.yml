server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=bookstore_chain;encrypt=true;trustServerCertificate=true
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        use_nationalized_character_data: true

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

app:
  jwt:
    secret: bookstore-chain-management-jwt-secret-key-2026
    expiration-ms: 86400000